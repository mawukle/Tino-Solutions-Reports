<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage - Tino Solutions Limited</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script>
        // Function to show links based on selected department
        function filterLinks(department) {
            // Hide all navigation menus
            const allMenus = document.querySelectorAll('.department-links');
            allMenus.forEach(menu => menu.style.display = 'none');

            // Show the selected department's menu
            const selectedMenu = document.getElementById(department);
            if (selectedMenu) {
                selectedMenu.style.display = 'block';
            }
        }
    </script>
</head>
<body>
    <div class="container_5">

        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo1"><br><br>
        <h1>Welcome to Tino Solutions Limited</h1>
        <p>Select a department to navigate:</p>

        <!-- Department Buttons -->
        <div class="departments">
            <button onclick="filterLinks('installation')">Installation</button>
            <button onclick="filterLinks('sales')">Sales</button>
            <button onclick="filterLinks('logistics')">Logistics</button>
        </div>

        <!-- Navigation Menus -->
        <nav class="navigation-menu">

            <!-- Installation Links -->
            <ul id="installation" class="department-links" style="display: none;">
                <li><a href="{{ url_for('assign_job') }}">Daily Report</a></li>
                <li><a href="{{ url_for('summary') }}">Summary</a></li>
                <li><a href="{{ url_for('team_ranking') }}">Team Ranking</a></li>
                <li><a href="{{ url_for('assign_teams') }}">Team Assignment</a></li>
            </ul>

            <!-- Sales Links -->
            <ul id="sales" class="department-links" style="display: none;">
                <li><a href="{{ url_for('client_list') }}">Client List</a></li>
                <li><a href="{{ url_for('newClient_entryForm') }}">New Client Entry Form</a></li>
            </ul>

            <!-- Logistics Links -->
            <ul id="logistics" class="department-links" style="display: none;">
                <li><a href="{{ url_for('client_list') }}">Client List</a></li>
            </ul>

        </nav>
    </div>
</body>
</html>
