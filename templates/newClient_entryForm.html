<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <!-- Include jQuery for autocomplete functionality -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        <!-- Back to Homepage Link -->
        <a href="{{ url_for('index') }}" class="back-link">The Renewable Energy Experts</a>

        <h1>TINO SOLUTIONS LIMITED CLIENT ENTRY FORM</h1>

        <!-- Navigation -->
        <nav>
            <a href="{{ url_for('client_list') }}">View Client List</a>
        </nav>

        <!-- Message Display -->
        {% if message %}
            <p>{{ message }}</p>
        {% endif %}

        <!-- Manual Client Entry Form -->
        <form id="manualForm" method="POST">
          <div class="form-row">
            <label for="client_name">Client Name:</label>
            <input type="text" id="client_name" name="client_name" placeholder="Client Name" required>
          </div>

          <div class="form-row">
            <label for="town">Town:</label>
            <input type="text" id="town" name="town" placeholder="Town" required autocomplete="off">
          </div>

          <div class="form-row">
            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="City" required autocomplete="off">
          </div>

          <div class="form-row">
            <label for="phone_number">Phone Number:</label>
            <input type="text" id="phone_number" name="phone_number" placeholder="Phone Number" autocomplete="off">
          </div>

          <div class="form-row">
            <label for="contact_person">Contact Person:</label>
            <input type="text" id="contact_person" name="contact_person" placeholder="Contact Person" autocomplete="off">
          </div>

          <div class="form-row">
            <label for="email_address">Email Address:</label>
            <input type="email" id="email_address" name="email_address" placeholder="Email Address" autocomplete="off">
          </div>

          <div class="form-row">
            <div></div> <!-- Empty cell for alignment -->
            <button type="submit">Add Client</button>
          </div>
        </form>
    </div>

    <script>
        $(function () {
            $("#client_name").autocomplete({
                source: function (request, response) {
                    $.ajax({
                        url: "{{ url_for('autocomplete_client') }}",
                        data: {
                            term: request.term
                        },
                        success: function (data) {
                            response(data);
                        },
                        error: function () {
                            console.error("Autocomplete request failed.");
                        }
                    });
                },
                minLength: 2 // Minimum characters before search
            });
        });
    </script>
</body>
</html>
