<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Disbursement</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <style>
        .quantity-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .quantity-row label {
            flex: 1;
        }
        .quantity-row input {
            width: 80px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container_4">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">

        <a href="{{ url_for('index') }}" class="back-link">The Renewable Energy Experts</a>

        <h1>Stock Disbursement</h1>

        <form id="add-component-form" class="filter-form">
            <div class="form-filters">
                <div>
                    <label for="client_name">Enter Client Name:</label>
                    <input type="text" id="client_name" name="client_name" required>
                </div>
                <br>
                <div>
                    <label for="job_date_display">Select Date:</label>
                    <input type="text" id="job_date_display" autocomplete="off" required>
                    <input type="hidden" id="job_date" name="date">
                </div>
                <br>
                <div>
                    <button type="button" id="add-component">Add Component</button>
                </div>
                <br>
                <div>
                    <label for="component-dropdown">Select Component:</label>
                    <select id="component-dropdown" required>
                        <option value="">--Select Component--</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="item-description-dropdown">Select Item Description:</label>
                    <select id="item-description-dropdown" multiple required>
                        <option value="">--Select Item Description--</option>
                    </select>
                </div>
                <br>
                <div id="quantity-container" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Quantity inputs will be dynamically added here -->
                </div>
                <br>
                <div>
                    <label for="installed-by">Installed By:</label>
                    <select id="installed-by" name="installed_by" required>
                        <option value="Tino Team">Tino Team</option>
                        <option value="Client">Client</option>
                    </select>
                </div>
                <br>
                <div>
                    <button type="button" id="add-to-table">Add to Table</button>
                </div>
            </div>
        </form>

        <h2>Items Issued</h2>
        <div class="table-container">
            <table id="issued-items-table" border="1">
                <thead>
                    <tr>
                        <th>Component</th>
                        <th>Item Description</th>
                        <th>Quantity</th>
                        <th>Remaining Stock</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be dynamically added here -->
                </tbody>
            </table>
        </div>
        <br>
        <button id="submit-all" type="button">Submit All</button>

        <script>
            $(document).ready(function () {
                $('#job_date_display').datepicker({
                    dateFormat: 'yy-mm-dd',
                    onSelect: function (dateText) {
                        $('#job_date').val(dateText);
                    }
                });

                $('#add-component').click(function () {
                    $.get('/get_components', function (data) {
                        const componentDropdown = $('#component-dropdown');
                        componentDropdown.empty().append('<option value="">--Select Component--</option>');
                        data.forEach(function (component) {
                            componentDropdown.append(`<option value="${component}">${component}</option>`);
                        });
                    }).fail(function () {
                        alert('Error loading components.');
                    });
                });

                $('#component-dropdown').change(function () {
                    const selectedComponent = $(this).val();
                    if (selectedComponent) {
                        $.get(`/get_item_descriptions/${selectedComponent}`, function (data) {
                            const itemDescriptionDropdown = $('#item-description-dropdown');
                            itemDescriptionDropdown.empty().append('<option value="">--Select Item Description--</option>');
                            data.forEach(function (item) {
                                itemDescriptionDropdown.append(`<option value="${item}">${item}</option>`);
                            });
                        }).fail(function () {
                            alert('Error loading item descriptions.');
                        });
                    }
                });

                $('#item-description-dropdown').change(function () {
                    const selectedItems = $(this).val();
                    const container = $('#quantity-container');
                    container.empty();

                    selectedItems.forEach(function (item) {
                        container.append(`
                            <div class="quantity-row">
                                <label>${item}:</label>
                                <input type="number" class="item-quantity" data-item="${item}" min="1" max="999999" required>
                            </div>
                        `);
                    });
                });

                $('#add-to-table').click(function () {
                    const component = $('#component-dropdown').val();
                    if (!component) {
                        alert('Please select a component.');
                        return;
                    }

                    const rows = [];
                    const fetchPromises = [];

                    $('.item-quantity').each(function () {
                        const itemDescription = $(this).data('item');
                        const quantity = $(this).val();

                        if (!quantity) {
                            alert(`Please enter a quantity for ${itemDescription}.`);
                            return false;
                        }

                        const encodedItemName = encodeURIComponent(itemDescription);
                        const fetchPromise = $.get(`/get_remaining_stock/${encodedItemName}`)
                            .then(function (data) {
                                rows.push({
                                    itemDescription: data.Item_Description,
                                    quantity: quantity,
                                    remainingStock: data.Quantity
                                });
                            })
                            .fail(function (xhr) {
                                const error = xhr.responseJSON?.error || 'Unknown error occurred';
                                alert(`Error fetching remaining stock for ${itemDescription}: ${error}`);
                            });

                        fetchPromises.push(fetchPromise);
                    });

                    Promise.all(fetchPromises).then(() => {
                        rows.forEach(function (row) {
                            $('#issued-items-table tbody').append(`
                                <tr>
                                    <td>${component}</td>
                                    <td>${row.itemDescription}</td>
                                    <td>${row.quantity}</td>
                                    <td>${row.remainingStock}</td>
                                </tr>
                            `);
                        });

                        $('#quantity-container').empty();
                        $('#item-description-dropdown').val('');
                    });
                });

                $('#submit-all').click(function () {
                    const clientName = $('#client_name').val();
                    const date = $('#job_date').val();
                    const installedBy = $('#installed-by').val();

                    if (!clientName || !date || !installedBy) {
                        alert('Please fill out all required fields: Client Name, Date, and Installed By.');
                        return;
                    }

                    const items = [];
                    $('#issued-items-table tbody tr').each(function () {
                        const row = $(this).find('td');
                        items.push({
                            component: row.eq(0).text(),
                            item_description: row.eq(1).text(),
                            quantity: row.eq(2).text()
                        });
                    });

                    if (items.length === 0) {
                        alert('No items to submit. Please add items to the table.');
                        return;
                    }

                    const payload = {
                        client_name: clientName,
                        date: date,
                        installed_by: installedBy,
                        items: items
                    };

                    $.ajax({
                        url: '/submit_component',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(payload),
                        success: function () {
                            alert('Items submitted successfully.');
                            $('#issued-items-table tbody').empty();
                        },
                        error: function () {
                            alert('Error submitting items.');
                        }
                    });
                });
            });
        </script>
    </div>
</body>
</html>
