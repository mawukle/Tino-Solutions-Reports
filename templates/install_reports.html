<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Revenue Reports</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .container_1 {
            padding: 20px;
        }
        /* Wrap each chart in a bordered box */
        .chart-wrapper {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        canvas {
            width: 100% !important;
            height: auto !important; /* remove or override */
            aspect-ratio: 1 / 1; /* new addition */
            /*max-width: 800px;*/
        }
        .message {
            color: red;
        }
        .filters {
            margin: 10px 0;
        }
        select, input[type="month"] {
            margin-right: 10px;
            padding: 4px;
        }
        .filter-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .filter-row label,
        .filter-row select,
        .filter-row input,
        .filter-row button {
            margin: 0;
        }
        .chart-toggle {
            min-width: 200px;
        }
    </style>
</head>
<body>
<div class="container_1">
    <img src="/static/logo.png" alt="Logo" class="logo">
    <a href="/projects" class="back-link">← Back to Projects</a>
    <h1>TINO SOLUTIONS LIMITED<br>MONTHLY PROJECTS REPORT</h1>

    {% if message %}
    <p class="message">{{ message }}</p>
    {% endif %}

    <!-- Filters -->
    <div class="filters">
        <div class="filter-row">
            <label for="chartSelect">Select Charts to Display:</label>
            <select id="chartSelect" class="chart-toggle" multiple size="6">
                <option value="kvaChart" selected>kVA Chart</option>
                <option value="kwhChart" selected>kWh Chart</option>
                <option value="kwpChart" selected>kWp Chart</option>
                <option value="installedCapacitiesChart" selected>Installed Capacities Chart</option>
                <option value="completedInstallerChart" selected>Installer Chart</option>
                <option value="statusChart" selected>Project Status Chart</option>
            </select>

            <label for="fromMonth">From:</label>
            <input type="month" id="fromMonth">

            <label for="toMonth">To:</label>
            <input type="month" id="toMonth">

            <button onclick="applyFilters()">Apply Filters</button>
        </div>
    </div>

    <!-- Each chart wrapped in a bordered div -->
    <div class="chart-wrapper"><canvas id="kvaChart" style="display:none;"></canvas></div>
    <div class="chart-wrapper"><canvas id="kwhChart" style="display:none;"></canvas></div>
    <div class="chart-wrapper"><canvas id="kwpChart" style="display:none;"></canvas></div>
    <div class="chart-wrapper"><canvas id="installedCapacitiesChart" style="display:none;"></canvas></div>
    <div class="chart-wrapper"><canvas id="completedInstallerChart" style="display:none;"></canvas></div>
    <div class="chart-wrapper"><canvas id="statusChart" style="display:none;"></canvas></div>
</div>

<script>
    const labels = {{ labels | tojson }};
    const allData = {{ data | tojson }};
    const originalData = allData.revenue;
    const chartInstances = {};
    const colors = [
        '#e6194b', '#3cb44b', '#ffe119', '#4363d8',
        '#f58231', '#911eb4', '#46f0f0', '#f032e6',
        '#bcf60c', '#fabebe', '#008080', '#e6beff'
    ];

    function formatMonthLabel(monthStr) {
        const [year, month] = monthStr.split("-");
        const date = new Date(year, parseInt(month) - 1);
        return date.toLocaleString('default', { month: 'short', year: 'numeric' });  // e.g., "Jan 2025"
    }

    function buildChart(canvasId, title, yLabel, datasetObj, monthsToShow, xLabel = 'Sales Person') {
        const canvas = document.getElementById(canvasId);
        const wrapper = canvas.parentNode; // Get the parent wrapper
        const ctx = canvas.getContext('2d');

        if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

        const xLabels = Object.keys(datasetObj);
        const datasets = [];

        if (xLabels.length === 0 || monthsToShow.length === 0) {
            wrapper.style.display = "none";  // Hide the entire wrapper if no data
            return;
        }

        monthsToShow.forEach((month, i) => {
            const data = xLabels.map(person => datasetObj[person][i] ?? 0);
            datasets.push({
                label: formatMonthLabel(month),
                data: data,
                backgroundColor: colors[i % colors.length],
                borderWidth: 1,
                stack: 'stack1'
            });
        });

        const hasData = datasets.some(ds => ds.data.some(val => val !== 0));
        if (!hasData) {
            wrapper.style.display = "none";  // Hide the entire wrapper if empty
            return;
        }

        wrapper.style.display = "block";  // Show the wrapper if it has data
        canvas.style.display = "block";  // Show if it has data

        chartInstances[canvasId] = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: xLabels,
                datasets: datasets
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: title
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                        title: {
                            display: true,
                            text: xLabel  // Use the provided xLabel parameter
                        }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: yLabel
                        }
                    }
                }
            }
        });
    }

    function applyFilters() {
        const selectedPersons = ["all"];  // Always include all persons
        const fromMonth = document.getElementById("fromMonth").value;
        const toMonth = document.getElementById("toMonth").value;

        // Filter the months (labels)
        const filteredLabels = labels.filter(label => {
            if (fromMonth && label < fromMonth) return false;
            if (toMonth && label > toMonth) return false;
            return true;
        });

        function filterDataSet(dataSet) {
            const result = {};
            for (const key in dataSet) {
                if (!selectedPersons.includes("all") && !selectedPersons.includes(key)) continue;

                const originalArray = dataSet[key];
                const filteredArray = filteredLabels.map(month => {
                    const idx = labels.indexOf(month);
                    return originalArray[idx] ?? 0;
                });

                if (filteredArray.some(val => val !== 0)) {
                    result[key] = filteredArray;
                }
            }
            return result;
        }

        function filterGroupedData(dataSet) {
            const result = {};
            for (const month of filteredLabels) {
                if (dataSet[month]) {
                    result[month] = dataSet[month];
                }
            }
            return result;
        }

        // Get selected chart IDs from checkboxes
        const selectedCharts = Array.from(document.getElementById("chartSelect").selectedOptions).map(opt => opt.value);

        if (selectedCharts.includes("statusChart")) {
            buildChart("statusChart", "Project Status Breakdown", "Number of Projects", filterDataSet(allData.status), filteredLabels, "Project Status");
        } else {
            document.getElementById("statusChart").parentNode.style.display = "none";
        }

        if (selectedCharts.includes("completedInstallerChart")) {
            buildChart("completedInstallerChart", "Projects Completed per Lead Installer", "Completed Projects", filterDataSet(allData.completed_per_installer), filteredLabels, "Lead Installer");
        } else {
            document.getElementById("completedInstallerChart").parentNode.style.display = "none";
        }

        if (selectedCharts.includes("kvaChart")) {
            buildChart("kvaChart", "Total kVA per Lead Installer", "kVA", filterDataSet(allData.kva_per_installer), filteredLabels, "Lead Installer");
        } else {
            document.getElementById("kvaChart").parentNode.style.display = "none";
        }

        if (selectedCharts.includes("kwhChart")) {
            buildChart("kwhChart", "Total kWh per Lead Installer", "kWh", filterDataSet(allData.kwh_per_installer), filteredLabels, "Lead Installer");
        } else {
            document.getElementById("kwhChart").parentNode.style.display = "none";
        }

        if (selectedCharts.includes("kwpChart")) {
            buildChart("kwpChart", "Total kWp per Lead Installer", "kWp", filterDataSet(allData.kwp_per_installer), filteredLabels, "Lead Installer");
        } else {
            document.getElementById("kwpChart").parentNode.style.display = "none";
        }

        if (selectedCharts.includes("installedCapacitiesChart")) {
            createInstalledCapacitiesChart("installedCapacitiesChart", "Installed Capacities Breakdown", "Capacity", allData.installed_capacities, filteredLabels);
        } else {
            document.getElementById("installedCapacitiesChart").parentNode.style.display = "none";
        }
    }

    function createInstalledCapacitiesChart(canvasId, title, yLabel, datasetObj, monthsToShow) {
        const canvas = document.getElementById(canvasId);
        const wrapper = canvas.parentNode; // Get the parent wrapper
        const ctx = canvas.getContext('2d');

        if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

        // Reorganize the data by month first, then by capacity type
        const monthlyData = {};

        // Get all capacity types
        const capacityTypes = ['kVA', 'kWh', 'kWp'];

        // Organize by month
        capacityTypes.forEach(type => {
            if (datasetObj[type]) {
                for (const month in datasetObj[type]) {
                    if (!monthlyData[month]) {
                        monthlyData[month] = {
                            'kVA': 0,
                            'kWh': 0,
                            'kWp': 0
                        };
                    }
                    // Round values to 2 decimal places when storing
                    monthlyData[month][type] = Math.round(datasetObj[type][month] * 100) / 100;
                }
            }
        });

        // Filter months based on monthsToShow
        const filteredMonths = monthsToShow.filter(month => monthlyData[month]);

        if (filteredMonths.length === 0) {
            canvas.style.display = "none";
            return;
        }

        // Prepare datasets - one for each month
        const datasets = filteredMonths.map((month, i) => {
            return {
                label: formatMonthLabel(month),
                data: [
                    monthlyData[month]['kVA'] || 0,
                    monthlyData[month]['kWh'] || 0,
                    monthlyData[month]['kWp'] || 0
                ],
                backgroundColor: colors[i % colors.length],
                borderWidth: 1
            };
        });

        const hasData = datasets.some(ds => ds.data.some(val => val !== 0));
        if (!hasData) {
            wrapper.style.display = "none";
            return;
        }

        wrapper.style.display = "block";
        canvas.style.display = "block";

        chartInstances[canvasId] = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ["kVA", "kWh", "kWp"],
                datasets: datasets
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: title
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                            label: function(context) {
                                // Format the value to 2 decimal places
                                const roundedValue = Math.round(context.raw * 100) / 100;
                                return `${context.dataset.label}: ${roundedValue.toFixed(2)} ${context.label}`;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                        title: {
                            display: true,
                            text: 'Capacity Type'
                        }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: yLabel
                        },
                        ticks: {
                            // Format y-axis labels to 2 decimal places
                            callback: function(value) {
                                return value.toFixed(2);
                            }
                        }
                    }
                }
            }
        });
    }

    // Initial load: Filter labels from January of the current year
    const currentYear = new Date().getFullYear();
    const currentMonth = new Date().getMonth(); // 0-indexed
    const filteredLabels = labels.filter(label => {
        const [year, month] = label.split("-");
        return parseInt(year) === currentYear && parseInt(month) - 1 <= currentMonth;
    });

    function filterDataSetForInitialLoad(dataSet) {
        const result = {};
        for (const key in dataSet) {
            const originalArray = dataSet[key];
            const filteredArray = filteredLabels.map(month => {
                const idx = labels.indexOf(month);
                return originalArray[idx] ?? 0;
            });

            if (filteredArray.some(val => val !== 0)) {
                result[key] = filteredArray;
            }
        }
        return result;
    }

    const selectedChartsInit = Array.from(document.getElementById("chartSelect").selectedOptions).map(opt => opt.value);

    if (selectedChartsInit.includes("statusChart")) {
        buildChart('statusChart', 'Project Status Breakdown', 'Number of Projects', filterDataSetForInitialLoad(allData.status), filteredLabels, "Project Status");
    }

    if (selectedChartsInit.includes("completedInstallerChart")) {
        buildChart('completedInstallerChart', 'Projects Completed per Lead Installer', 'Completed Projects', filterDataSetForInitialLoad(allData.completed_per_installer), filteredLabels, "Lead Installer");
    }

    if (selectedChartsInit.includes("kvaChart")) {
        buildChart('kvaChart', 'Total kVA per Lead Installer', 'kVA', filterDataSetForInitialLoad(allData.kva_per_installer), filteredLabels, "Lead Installer");
    }

    if (selectedChartsInit.includes("kwhChart")) {
        buildChart('kwhChart', 'Total kWh per Lead Installer', 'kWh', filterDataSetForInitialLoad(allData.kwh_per_installer), filteredLabels, "Lead Installer");
    }

    if (selectedChartsInit.includes("kwpChart")) {
        buildChart('kwpChart', 'Total kWp per Lead Installer', 'kWp', filterDataSetForInitialLoad(allData.kwp_per_installer), filteredLabels, "Lead Installer");
    }

    if (selectedChartsInit.includes("installedCapacitiesChart")) {
        createInstalledCapacitiesChart("installedCapacitiesChart", "Installed Capacities Breakdown", "Capacity", allData.installed_capacities, filteredLabels);
    }
</script>
</body>
</html>
