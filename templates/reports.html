<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Revenue Reports</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .container_1 {
            padding: 20px;
        }
        canvas {
            max-width: 100%;
            height: auto;
        }
        .message {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container_1">
        <img src="/static/logo.png" alt="Logo" class="logo">
        <a href="/projects" class="back-link">← Back to Projects</a>
        <h1>TINO SOLUTIONS LIMITED<br>MONTHLY SALES REPORT</h1>

        {% if message %}
        <p class="message">{{ message }}</p>
        {% endif %}

        <canvas id="revenueChart"></canvas>
    </div>

    <script>
        const labels = {{ labels | tojson }};
        const data = {
            labels: labels,
            datasets: [
                {% for person, values in data.items() %}
                {
                    label: "{{ person }}",
                    data: {{ values | tojson }},
                    borderWidth: 2,
                    fill: false,
                    tension: 0.3,
                    borderColor: `hsl({{ loop.index0 * 60 }}, 70%, 50%)`
                },
                {% endfor %}
            ]
        };

        const config = {
            type: 'line',
            data: data,
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Total Revenue by Sales Person (Month-on-Month)'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Amount Paid (Revenue)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Month'
                        }
                    }
                }
            }
        };

        new Chart(document.getElementById('revenueChart'), config);
    </script>
</body>
</html>
