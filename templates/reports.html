<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Revenue Reports</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .container_1 {
            padding: 20px;
        }
        canvas {
            max-width: 100%;
            height: auto;
        }
        .message {
            color: red;
        }
        .filters {
            margin: 10px 0;
        }
        select, input[type="month"] {
            margin-right: 10px;
            padding: 4px;
        }
        .button-download {
            margin-top: 10px;
            padding: 6px 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container_1">
    <img src="/static/logo.png" alt="Logo" class="logo">
    <a href="/projects" class="back-link">← Back to Projects</a>
    <h1>TINO SOLUTIONS LIMITED<br>MONTHLY SALES REPORT</h1>

    {% if message %}
    <p class="message">{{ message }}</p>
    {% endif %}

    <!-- Filters -->
    <div class="filters">
        <label for="salesPersonSelect">Sales Person:</label>
        <select id="salesPersonSelect">
            <option value="all">All</option>
            {% for person in data.keys() %}
            <option value="{{ person }}">{{ person }}</option>
            {% endfor %}
        </select>

        <label for="fromMonth">From:</label>
        <input type="month" id="fromMonth">

        <label for="toMonth">To:</label>
        <input type="month" id="toMonth">

        <button onclick="applyFilters()">Apply Filters</button>
    </div>

    <!-- Chart -->
    <canvas id="revenueChart"></canvas>

    <!-- PDF Download -->
    <button class="button-download" onclick="downloadPDF()">Download as PDF</button>
</div>

<script>
    const labels = {{ labels | tojson }};
    const originalData = {{ data | tojson }};
    const colors = [
        '#e6194b', '#3cb44b', '#ffe119', '#4363d8',
        '#f58231', '#911eb4', '#46f0f0', '#f032e6',
        '#bcf60c', '#fabebe', '#008080', '#e6beff'
    ];

    let chartInstance;

    function buildChart(filteredData, filteredLabels) {
        if (chartInstance) chartInstance.destroy();

        const datasets = Object.entries(filteredData).map(([person, values], i) => ({
            label: person,
            data: values,
            borderWidth: 2,
            fill: false,
            tension: 0.3,
            borderColor: colors[i % colors.length]
        }));

        const config = {
            type: 'line',
            data: {
                labels: filteredLabels,
                datasets: datasets
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Total Revenue by Sales Person (Month-on-Month)'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Amount Paid (Revenue)'
                        },
                        ticks: {
                            stepSize: 10000
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Month'
                        }
                    }
                }
            }
        };

        const ctx = document.getElementById('revenueChart').getContext('2d');
        chartInstance = new Chart(ctx, config);
    }

    function applyFilters() {
        const selectedPerson = document.getElementById("salesPersonSelect").value;
        const fromMonth = document.getElementById("fromMonth").value;
        const toMonth = document.getElementById("toMonth").value;

        const filteredLabels = labels.filter(label => {
            if (fromMonth && label < fromMonth) return false;
            if (toMonth && label > toMonth) return false;
            return true;
        });

        let filteredData = {};
        if (selectedPerson === "all") {
            for (const person in originalData) {
                filteredData[person] = filteredLabels.map(month => {
                    const idx = labels.indexOf(month);
                    return originalData[person][idx] ?? 0;
                });
            }
        } else {
            filteredData[selectedPerson] = filteredLabels.map(month => {
                const idx = labels.indexOf(month);
                return originalData[selectedPerson][idx] ?? 0;
            });
        }

        buildChart(filteredData, filteredLabels);
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const canvas = document.getElementById('revenueChart');
        const chartImg = canvas.toDataURL("image/jpeg", 1.0);
        const pdf = new jsPDF();

        pdf.setFontSize(18);
        pdf.text("Monthly Sales Report", 15, 20);
        pdf.addImage(chartImg, 'JPEG', 10, 30, 190, 100);
        pdf.save("monthly_sales_report.pdf");
    }

    // Initial load
    buildChart(originalData, labels);
</script>
</body>
</html>
