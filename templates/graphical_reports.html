<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphical Reports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* General Styles */
        .chart-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin: 20px 0;
        }

        .chart-canvas {
            flex: 1;
            max-width: 400px;
            max-height: 400px;
        }

        .chart-legend {
            flex: 1;
            margin-left: 20px;
            overflow: auto;
        }

        #teamRankingChart {
            width: 100% !important;
            height: auto;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container_4">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        <a href="{{ url_for('index') }}" class="back-link">The Renewable Energy Experts</a>
        <h1>Graphical Reports</h1>

        <!-- Form to input start and end dates -->
        <form method="POST" action="/graphical_reports">
            <div id="date_filter">
                <label for="start_date">Start Date:</label>
                <input type="date" id="start_date" name="start_date" value="{{ start_date }}" required>

                <label for="end_date">End Date:</label>
                <input type="date" id="end_date" name="end_date" value="{{ end_date }}" required>
            </div>
            <button type="submit">Generate Graphs</button>
        </form>

        <!-- Team Rankings Graph -->
        {% if team_rankings %}
        <h2>Team Rankings</h2>
        <canvas id="teamRankingChart"></canvas>
        <script>
            const teamRankingData = {
                labels: {{ team_rankings | map(attribute='Team_Member_Name') | list | tojson }},
                datasets: [
                    {
                        label: 'Days Worked',
                        data: {{ team_rankings | map(attribute='days_worked') | list | tojson }},
                        backgroundColor: 'rgba(75, 192, 192, 0.6)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Clients Visited',
                        data: {{ team_rankings | map(attribute='clients_visited') | list | tojson }},
                        backgroundColor: 'rgba(153, 102, 255, 0.6)',
                        borderColor: 'rgba(153, 102, 255, 1)',
                        borderWidth: 1
                    }
                ]
            };

            new Chart(document.getElementById('teamRankingChart'), {
                type: 'bar',
                data: teamRankingData,
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' }
                    }
                }
            });
        </script>
        {% endif %}

        <!-- Client Visit Days Graph -->
        {% if client_days_data %}
        <h2>Client Visit Days</h2>
        <div class="chart-container">
            <canvas id="clientVisitDaysChart" class="chart-canvas"></canvas>
            <div class="chart-legend">
                <ul id="clientVisitDaysLegend"></ul>
            </div>
        </div>
        <script>
            const clientVisitDaysData = {
                labels: {{ client_days_data | map(attribute='Client_Name') | list | tojson }},
                datasets: [{
                    label: 'Unique Days Visited',
                    data: {{ client_days_data | map(attribute='unique_days_at_client') | list | tojson }},
                    backgroundColor: generateColors({{ client_days_data | length }}),
                    borderWidth: 1
                }]
            };

            new Chart(document.getElementById('clientVisitDaysChart'), {
                type: 'pie',
                data: clientVisitDaysData,
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                usePointStyle: true,
                                pointStyle: 'rectRounded'
                            }
                        }
                    }
                }
            });
        </script>
        {% endif %}

        <!-- Inverter Capacities Graph -->
        {% if inverter_data %}
        <h2>Inverter Capacities</h2>
        <div class="chart-container">
            <canvas id="inverterChart" class="chart-canvas"></canvas>
            <div class="chart-legend">
                <ul id="inverterLegend"></ul>
            </div>
        </div>
        <script>
            const inverterData = {
                labels: {{ inverter_data | map(attribute='Client_Name') | list | tojson }},
                datasets: [{
                    label: 'Total Inverter Capacity',
                    data: {{ inverter_data | map(attribute='total_inverter_capacity') | list | tojson }},
                    backgroundColor: generateColors({{ inverter_data | length }}),
                    borderWidth: 1
                }]
            };

            new Chart(document.getElementById('inverterChart'), {
                type: 'doughnut',
                data: inverterData,
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                usePointStyle: true,
                                pointStyle: 'rectRounded'
                            }
                        }
                    }
                }
            });
        </script>
        {% endif %}
    </div>
</body>
</html>
