<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphical Reports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Ensures the chart canvas takes up full width */
        #rankingChart {
            width: 100% !important;
            height: 400px; /* Adjust the height as needed */
            max-width: 100%;
            margin: 20px auto;
        }
    </style>

</head>
<body>
    <div class="container_4">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        <a href="{{ url_for('index') }}" class="back-link">The Renewable Energy Experts</a>
        <h1>Graphical Reports</h1>

        <!-- Form to input start and end dates -->
        <form method="POST" action="/graphical_reports">
            <div id="date_filter">
                <label for="start_date">Start Date:</label>
                <input type="date" id="start_date" name="start_date" value="{{ start_date }}" required>

                <label for="end_date">End Date:</label>
                <input type="date" id="end_date" name="end_date" value="{{ end_date }}" required>
            </div>
            <button type="submit">Generate Graphs</button>
        </form>

        <!-- Graph for Team Rankings -->
        {% if team_rankings %}
        <h2>Team Rankings</h2>
        <canvas id="teamRankingChart"></canvas>
        <script>
            const teamRankingData = {
                labels: {{ team_rankings | map(attribute='Team_Member_Name') | list | tojson }},
                datasets: [
                    {
                        label: 'Days Worked',
                        data: {{ team_rankings | map(attribute='days_worked') | list | tojson }},
                        backgroundColor: 'rgba(75, 192, 192, 0.6)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Clients Visited',
                        data: {{ team_rankings | map(attribute='clients_visited') | list | tojson }},
                        backgroundColor: 'rgba(153, 102, 255, 0.6)',
                        borderColor: 'rgba(153, 102, 255, 1)',
                        borderWidth: 1
                    }
                ]
            };

            const teamRankingConfig = {
                type: 'bar',
                data: teamRankingData,
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    }
                }
            };

            new Chart(
                document.getElementById('teamRankingChart'),
                teamRankingConfig
            );
        </script>
        {% endif %}

        <!-- Graph for Client Visit Days -->
        {% if client_days_data %}
        <h2>Client Visit Days</h2>
        <canvas id="clientVisitDaysChart"></canvas>
        <script>
            const clientVisitDaysData = {
                labels: {{ client_days_data | map(attribute='Client_Name') | list | tojson }},
                datasets: [
                    {
                        label: 'Unique Days Visited',
                        data: {{ client_days_data | map(attribute='unique_days_at_client') | list | tojson }},
                        backgroundColor: [], // Will be populated dynamically
                        borderColor: 'rgba(255, 159, 64, 1)',
                        borderWidth: 1
                    }
                ]
            };

            // Generate up to 60 distinct colors
            const generateColors = (n) => {
                let colors = [];
                for (let i = 0; i < n; i++) {
                    const hue = (i * 360 / n); // Spread hues evenly
                    colors.push(`hsl(${hue}, 70%, 70%)`);
                }
                return colors;
            };

            const colors = generateColors(80);
            let counter = 0;
            clientVisitDaysData.datasets[0].backgroundColor = clientVisitDaysData.labels.map(() => colors[counter++ % colors.length]);

            // Create labels that include both the client name and the unique days visited
            const modifiedLabels = clientVisitDaysData.labels.map((label, index) => {
                const uniqueDays = clientVisitDaysData.datasets[0].data[index];
                return `${uniqueDays}: ${label}`;
            });

            const clientVisitDaysConfig = {
                type: 'pie',
                data: {
                    labels: modifiedLabels,
                    datasets: clientVisitDaysData.datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                usePointStyle: true, // Makes the legend markers circular
                                pointStyle: 'rectRounded', // Overrides to make them small rounded squares
                            }

                        }
                    }
                }
            };

            new Chart(
                document.getElementById('clientVisitDaysChart'),
                clientVisitDaysConfig
            );
        </script>

        {% endif %}



        <!-- Graph for Inverter Capacities -->
        {% if inverter_data %}
        <h2>Inverter Capacities</h2>
        <canvas id="inverterChart"></canvas>
        <script>
            const inverterData = {
                labels: {{ inverter_data | map(attribute='Client_Name') | list | tojson }},
                datasets: [
                    {
                        label: 'Total Inverter Capacity',
                        data: {{ inverter_data | map(attribute='total_inverter_capacity') | list | tojson }},
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }
                ]
            };

            // Generate up to 60 distinct colors
            const generateColors = (n) => {
                let colors = [];
                for (let i = 0; i < n; i++) {
                    const hue = (i * 360 / n); // Spread hues evenly
                    colors.push(`hsl(${hue}, 70%, 70%)`);
                }
                return colors;
            };

            const colors = generateColors(80);
            let counter = 0;
            inverterData.datasets[0].backgroundColor = inverterData.labels.map(() => colors[counter++ % colors.length]);

            // Create labels that include both the client name and the Inverter Capacities
            const modifiedLabels = inverterData.labels.map((label, index) => {
                const inverterCapacity = inverterData.datasets[0].data[index];
                return `${inverterCapacity}: ${label}`;
            });

            const inverterConfig = {
                type: 'pie',
                data: {
                    labels: modifiedLabels,
                    datasets: inverterData.datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                usePointStyle: true, // Makes the legend markers circular
                                pointStyle: 'rectRounded', // Overrides to make them small rounded squares
                            }

                        }
                    }
                }
            };

            new Chart(
                document.getElementById('inverterChart'),
                inverterConfig
            );
        </script>

        {% endif %}

        <!-- Add similar graph sections for battery_data and solar_panel_data -->

    </div>
</body>
</html>
