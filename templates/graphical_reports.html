<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Ranking - Graphical Report</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Ensure charts are visually distinct */
        .chart-container {
            width: 100% !important;
            max-width: 100%;
            margin: 20px auto;
        }
        canvas {
            height: 400px;
        }
    </style>
</head>
<body>
    <div class="container_4">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        <a href="{{ url_for('index') }}" class="back-link">The Renewable Energy Experts</a>
        <h1>TEAM RANKING - GRAPHICAL REPORT</h1>

        <!-- Form to input start and end dates -->
        <form id="graphicalReportsForm">
            <div id="date_filter">
                <label for="start_date">Start Date:</label>
                <input type="date" id="start_date" name="start_date" required>

                <label for="end_date">End Date:</label>
                <input type="date" id="end_date" name="end_date" required>
            </div>
            <button type="submit">Get Rankings</button>
        </form>

        <!-- Chart Containers -->
        <div class="chart-container">
            <canvas id="rankingChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="clientDaysChart"></canvas>
        </div>

        <script>
            const form = document.getElementById('graphicalReportsForm');
            const rankingCtx = document.getElementById('rankingChart').getContext('2d');
            const clientDaysCtx = document.getElementById('clientDaysChart').getContext('2d');
            let rankingChart, clientDaysChart;

            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                // Get form data
                const formData = new FormData(form);
                const startDate = formData.get('start_date');
                const endDate = formData.get('end_date');

                try {
                    // Fetch data via AJAX
                    const response = await fetch('/team_ranking', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ start_date: startDate, end_date: endDate })
                    });

                    if (!response.ok) throw new Error('Failed to fetch rankings');

                    const data = await response.json();

                    if (data.length === 0) {
                        alert('No data available for the selected period.');
                        return;
                    }

                    // Process data for both charts
                    const teamMembers = data.map(item => item.Team_Member_Name);
                    const rankingScores = data.map(item => item.ranking_score);

                    const clientNames = [...new Set(data.flatMap(item => item.client_names || []))]; // Flatten array of client names
                    const totalDaysAtClients = clientNames.map(client => {
                        return data.reduce((sum, item) => {
                            if (item.client_names && item.client_names.includes(client)) {
                                return sum + item.total_days_at_clients;
                            }
                            return sum;
                        }, 0);
                    });

                    // Update Ranking Chart
                    if (rankingChart) rankingChart.destroy();
                    rankingChart = new Chart(rankingCtx, {
                        type: 'bar',
                        data: {
                            labels: teamMembers,
                            datasets: [{
                                label: 'Ranking Score',
                                data: rankingScores,
                                backgroundColor: 'rgba(75, 192, 192, 0.6)',
                                borderColor: 'rgba(75, 192, 192, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: { position: 'top' },
                                title: { display: true, text: 'Team Ranking Scores' }
                            },
                            scales: {
                                y: { beginAtZero: true },
                                x: {
                                    ticks: {
                                        autoSkip: false,
                                        maxRotation: 90,
                                        minRotation: 45
                                    }
                                }
                            }
                        }
                    });

                    // Update Client Days Chart
                    if (clientDaysChart) clientDaysChart.destroy();
                    clientDaysChart = new Chart(clientDaysCtx, {
                        type: 'bar',
                        data: {
                            labels: clientNames,
                            datasets: [{
                                label: 'Total Days at Clients',
                                data: totalDaysAtClients,
                                backgroundColor: 'rgba(153, 102, 255, 0.6)',
                                borderColor: 'rgba(153, 102, 255, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: { position: 'top' },
                                title: { display: true, text: 'Total Days at Clients' }
                            },
                            scales: {
                                y: { beginAtZero: true },
                                x: {
                                    ticks: {
                                        autoSkip: false,
                                        maxRotation: 90,
                                        minRotation: 45
                                    }
                                }
                            }
                        }
                    });
                } catch (error) {
                    console.error(error);
                    alert('Error fetching data for graphical report');
                }
            });
        </script>
    </div>
</body>
</html>
