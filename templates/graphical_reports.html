<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphical Reports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Ensures the chart canvas takes up full width */
        #rankingChart {
            width: 100% !important;
            height: 400px; /* Adjust the height as needed */
            max-width: 100%;
            margin: 20px auto;
        }
    </style>

</head>
<body>
    <div class="container_4">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        <a href="{{ url_for('index') }}" class="back-link">The Renewable Energy Experts</a>
        <h1>Graphical Reports</h1>

        <!-- Form to input start and end dates -->
        <form method="POST" action="/graphical_reports">
            <div id="date_filter">
                <label for="start_date">Start Date:</label>
                <input type="date" id="start_date" name="start_date" value="{{ start_date }}" required>

                <label for="end_date">End Date:</label>
                <input type="date" id="end_date" name="end_date" value="{{ end_date }}" required>
            </div>
            <button type="submit">Generate Graphs</button>
        </form>

        <!-- Graph for Team Rankings -->
        {% if team_rankings %}
        <h2>Team Rankings</h2>
        <canvas id="teamRankingChart"></canvas>
        <script>
            const teamRankingData = {
                labels: {{ team_rankings | map(attribute='Team_Member_Name') | list | tojson }},
                datasets: [
                    {
                        label: 'Days Worked',
                        data: {{ team_rankings | map(attribute='days_worked') | list | tojson }},
                        backgroundColor: 'rgba(75, 192, 192, 0.6)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Clients Visited',
                        data: {{ team_rankings | map(attribute='clients_visited') | list | tojson }},
                        backgroundColor: 'rgba(153, 102, 255, 0.6)',
                        borderColor: 'rgba(153, 102, 255, 1)',
                        borderWidth: 1
                    }
                ]
            };

            const teamRankingConfig = {
                type: 'bar',
                data: teamRankingData,
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    }
                }
            };

            new Chart(
                document.getElementById('teamRankingChart'),
                teamRankingConfig
            );
        </script>
        {% endif %}

        <!-- Graph for Client Visit Days -->
        {% if client_days_data %}
        <h2>Client Visit Days (Top 20)</h2>
        <canvas id="clientVisitDaysChart"></canvas>
        <script>
            // Sort and Limit Data
            const sortedClientData = {{ client_days_data | list | tojson }}.sort((a, b) => b.unique_days_at_client - a.unique_days_at_client).slice(0, 20);

            const clientVisitDaysData = {
                labels: sortedClientData.map(item => item.Client_Name),
                datasets: [
                    {
                        label: 'Unique Days Visited',
                        data: sortedClientData.map(item => item.unique_days_at_client),
                        backgroundColor: 'rgba(255, 159, 64, 0.6)',
                        borderColor: 'rgba(255, 159, 64, 1)',
                        borderWidth: 1
                    }
                ]
            };

            const clientVisitDaysConfig = {
                type: 'bar',
                data: clientVisitDaysData,
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: { enabled: true },
                        zoom: {
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                mode: 'x'
                            },
                            pan: {
                                enabled: true,
                                mode: 'x'
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Clients' } },
                        y: { title: { display: true, text: 'Days Visited' } }
                    }
                }
            };

            new Chart(
                document.getElementById('clientVisitDaysChart'),
                clientVisitDaysConfig
            );
        </script>
        {% endif %}

        <!-- Graph for Inverter Capacities -->
        {% if inverter_data %}
        <h2>Inverter Capacities (Top 20)</h2>
        <canvas id="inverterChart"></canvas>
        <script>
            // Sort and Limit Data
            const sortedInverterData = {{ inverter_data | list | tojson }}.sort((a, b) => b.total_inverter_capacity - a.total_inverter_capacity).slice(0, 20);

            const inverterData = {
                labels: sortedInverterData.map(item => item.Client_Name),
                datasets: [
                    {
                        label: 'Total Inverter Capacity',
                        data: sortedInverterData.map(item => item.total_inverter_capacity),
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }
                ]
            };

            const inverterConfig = {
                type: 'bar',
                data: inverterData,
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: { enabled: true },
                        zoom: {
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                mode: 'x'
                            },
                            pan: {
                                enabled: true,
                                mode: 'x'
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Clients' } },
                        y: { title: { display: true, text: 'Inverter Capacity (kW)' } }
                    }
                }
            };

            new Chart(
                document.getElementById('inverterChart'),
                inverterConfig
            );
        </script>
        {% endif %}
    </div>
</body>
</html>
