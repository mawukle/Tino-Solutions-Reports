<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Ranking - Graphical Report</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        #rankingChart, #clientDaysChart, #employeeDaysChart, #inverterChart, #batteryChart, #solarPanelChart {
            width: 100% !important;
            height: 400px; /* Adjust the height as needed */
            max-width: 100%;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container_4">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        <a href="{{ url_for('index') }}" class="back-link">The Renewable Energy Experts</a>
        <h1>TEAM RANKING - GRAPHICAL REPORT</h1>

        <!-- Form to input start and end dates -->
        <form id="graphicalReportsForm">
            <div id="date_filter">
                <label for="start_date">Start Date:</label>
                <input type="date" id="start_date" name="start_date" required>

                <label for="end_date">End Date:</label>
                <input type="date" id="end_date" name="end_date" required>
            </div>
            <button type="submit">Get Rankings</button>
        </form>

        <!-- Chart Containers -->
        <div>
            <canvas id="rankingChart"></canvas>
        </div>
        <div>
            <canvas id="clientDaysChart"></canvas>
        </div>
        <div>
            <canvas id="employeeDaysChart"></canvas>
        </div>
        <div>
            <canvas id="inverterChart"></canvas>
        </div>
        <div>
            <canvas id="batteryChart"></canvas>
        </div>
        <div>
            <canvas id="solarPanelChart"></canvas>
        </div>

        <script>
            const form = document.getElementById('graphicalReportsForm');
            const rankingCtx = document.getElementById('rankingChart').getContext('2d');
            const clientDaysCtx = document.getElementById('clientDaysChart').getContext('2d');
            const employeeDaysCtx = document.getElementById('employeeDaysChart').getContext('2d');
            const inverterCtx = document.getElementById('inverterChart').getContext('2d');
            const batteryCtx = document.getElementById('batteryChart').getContext('2d');
            const solarPanelCtx = document.getElementById('solarPanelChart').getContext('2d');

            let rankingChart, clientDaysChart, employeeDaysChart, inverterChart, batteryChart, solarPanelChart;

            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const formData = new FormData(form);
                const startDate = formData.get('start_date');
                const endDate = formData.get('end_date');

                try {
                    const response = await fetch('/team_ranking', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ start_date: startDate, end_date: endDate })
                    });

                    if (!response.ok) throw new Error('Failed to fetch data');

                    const {
                        team_rankings,
                        client_days_data,
                        client_employee_days_data,
                        inverter_data,
                        battery_data,
                        solar_panel_data
                    } = await response.json();

                    // Team Rankings Chart
                    updateChart(rankingCtx, 'Team Ranking Scores', team_rankings, 'Team_Member_Name', 'ranking_score', rankingChart, 'bar');

                    // Client Visit Days Chart
                    updateChart(clientDaysCtx, 'Client Visit Days', client_days_data, 'Client_Name', 'unique_days_at_client', clientDaysChart, 'line');

                    // Client Employee-Days Chart
                    updateChart(employeeDaysCtx, 'Client Employee-Days', client_employee_days_data, 'Client_Name', 'total_employee_days', employeeDaysChart, 'bar');

                    // Inverter Capacities Chart
                    updateChart(inverterCtx, 'Inverter Capacities', inverter_data, 'Client_Name', 'total_inverter_capacity', inverterChart, 'bar');

                    // Battery Capacities Chart
                    updateChart(batteryCtx, 'Battery Capacities', battery_data, 'Client_Name', 'total_battery_capacity', batteryChart, 'bar');

                    // Solar Panel Capacities Chart
                    updateChart(solarPanelCtx, 'Solar Panel Capacities', solar_panel_data, 'Client_Name', 'total_solar_panel_capacity', solarPanelChart, 'bar');

                } catch (error) {
                    console.error(error);
                    alert('Error fetching data for graphical report');
                }
            });

            function updateChart(context, title, data, labelField, dataField, chartInstance, type) {
                const labels = data.map(item => item[labelField]);
                const values = data.map(item => item[dataField]);

                if (chartInstance) chartInstance.destroy();
                chartInstance = new Chart(context, {
                    type: type,
                    data: {
                        labels: labels,
                        datasets: [{
                            label: title,
                            data: values,
                            backgroundColor: 'rgba(75, 192, 192, 0.6)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'top' },
                            title: { display: true, text: title }
                        },
                        scales: {
                            y: { beginAtZero: true },
                            x: {
                                ticks: {
                                    autoSkip: false,
                                    maxRotation: 90,
                                    minRotation: 45
                                }
                            }
                        }
                    }
                });
            }
        </script>
    </div>
</body>
</html>
