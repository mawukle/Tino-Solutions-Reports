<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphical Reports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        <a href="{{ url_for('index') }}" class="back-link">The Renewable Energy Experts</a>
        <h1>Graphical Reports</h1>

        <!-- Form to input start and end dates -->
        <form method="POST" action="/graphical_reports">
            <div id="date_filter">
                <label for="start_date">Start Date:</label>
                <input type="date" id="start_date" name="start_date" value="{{ start_date }}" required>

                <label for="end_date">End Date:</label>
                <input type="date" id="end_date" name="end_date" value="{{ end_date }}" required>
            </div>
            <button type="submit">Generate Graphs</button>
        </form>

        <!-- Graphs container -->
        <div id="graphs">
            <h2>Team Rankings</h2>
            <canvas id="teamRankingsChart"></canvas>

            <h2>Client Visit Days</h2>
            <canvas id="clientVisitDaysChart"></canvas>

            <h2>Client Employee-Days</h2>
            <canvas id="clientEmployeeDaysChart"></canvas>

            <h2>Inverter Capacities</h2>
            <canvas id="inverterCapacitiesChart"></canvas>

            <h2>Battery Capacities</h2>
            <canvas id="batteryCapacitiesChart"></canvas>

            <h2>Solar Panel Capacities</h2>
            <canvas id="solarPanelCapacitiesChart"></canvas>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Data fetched from the backend via Jinja2 templating
            const teamRankings = {{ team_rankings | safe }};
            const clientDaysData = {{ client_days_data | safe }};
            const clientEmployeeDaysData = {{ client_employee_days_data | safe }};
            const inverterData = {{ inverter_data | safe }};
            const batteryData = {{ battery_data | safe }};
            const solarPanelData = {{ solar_panel_data | safe }};

            // Utility function to generate chart
            function createChart(ctx, labels, data, label, backgroundColor, borderColor) {
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: label,
                            data: data,
                            backgroundColor: backgroundColor,
                            borderColor: borderColor,
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }

            // Team Rankings Chart
            const teamRankingLabels = teamRankings.map(row => row.Team_Member_Name);
            const daysWorked = teamRankings.map(row => row.days_worked);
            const clientsVisited = teamRankings.map(row => row.clients_visited);
            createChart(
                document.getElementById('teamRankingsChart').getContext('2d'),
                teamRankingLabels,
                daysWorked,
                'Days Worked',
                'rgba(75, 192, 192, 0.2)',
                'rgba(75, 192, 192, 1)'
            );

            // Client Visit Days Chart
            const clientVisitLabels = clientDaysData.map(client => client.Client_Name);
            const uniqueDaysVisited = clientDaysData.map(client => client.unique_days_at_client);
            createChart(
                document.getElementById('clientVisitDaysChart').getContext('2d'),
                clientVisitLabels,
                uniqueDaysVisited,
                'Unique Days Visited',
                'rgba(255, 206, 86, 0.2)',
                'rgba(255, 206, 86, 1)'
            );

            // Client Employee-Days Chart
            const employeeDaysLabels = clientEmployeeDaysData.map(client => client.Client_Name);
            const employeeDays = clientEmployeeDaysData.map(client => client.total_employee_days);
            createChart(
                document.getElementById('clientEmployeeDaysChart').getContext('2d'),
                employeeDaysLabels,
                employeeDays,
                'Employee-Days',
                'rgba(153, 102, 255, 0.2)',
                'rgba(153, 102, 255, 1)'
            );

            // Inverter Capacities Chart
            const inverterLabels = inverterData.map(inverter => inverter.Client_Name);
            const inverterCapacities = inverterData.map(inverter => inverter.total_inverter_capacity);
            createChart(
                document.getElementById('inverterCapacitiesChart').getContext('2d'),
                inverterLabels,
                inverterCapacities,
                'Inverter Capacities',
                'rgba(255, 99, 132, 0.2)',
                'rgba(255, 99, 132, 1)'
            );

            // Battery Capacities Chart
            const batteryLabels = batteryData.map(battery => battery.Client_Name);
            const batteryCapacities = batteryData.map(battery => battery.total_battery_capacity);
            createChart(
                document.getElementById('batteryCapacitiesChart').getContext('2d'),
                batteryLabels,
                batteryCapacities,
                'Battery Capacities',
                'rgba(54, 162, 235, 0.2)',
                'rgba(54, 162, 235, 1)'
            );

            // Solar Panel Capacities Chart
            const solarPanelLabels = solarPanelData.map(panel => panel.Client_Name);
            const solarPanelCapacities = solarPanelData.map(panel => panel.total_solar_panel_capacity);
            createChart(
                document.getElementById('solarPanelCapacitiesChart').getContext('2d'),
                solarPanelLabels,
                solarPanelCapacities,
                'Solar Panel Capacities',
                'rgba(75, 192, 192, 0.2)',
                'rgba(75, 192, 192, 1)'
            );
        });
    </script>

</body>
</html>
