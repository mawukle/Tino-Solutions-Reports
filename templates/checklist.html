<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            margin: 20px;
        }
        .section-select {
            margin-bottom: 20px;
        }
        .section-button {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .section-button.selected {
            background-color: #28A745; /* Green for selected sections */
        }
        .section-checklist {
            display: none;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .section-checklist.active {
            display: block;
        }
        .checkbox-item {
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Project Checklist</h1>

    <!-- Section Selection with Buttons -->
    <div class="section-select">
        <h3>Select Sections:</h3>
        <button class="section-button" data-section="A">A. System Designs</button>
        <button class="section-button" data-section="B">B. PV Modules</button>
        <button class="section-button" data-section="C">C. Mounting Structures</button>
        <button class="section-button" data-section="D">D. Clamps</button>
        <button class="section-button" data-section="E">E. DC Trunking</button>
        <button class="section-button" data-section="F">F. DC Cabling</button>
        <button class="section-button" data-section="G">G. Protection Device</button>
        <button class="section-button" data-section="H">H. Weather Station</button>
        <button class="section-button" data-section="I">I. AC Cables</button>
        <button class="section-button" data-section="J">J. DC Combiner Box</button>
        <button class="section-button" data-section="K">K. Inverters</button>
        <button class="section-button" data-section="L">L. AC Cabinet</button>
        <button class="section-button" data-section="M">M. AC Integration into Main DB</button>
        <button class="section-button" data-section="N">N. Monitoring</button>
        <button class="section-button" data-section="P">P. Labelling</button>
        <button class="section-button" data-section="Q">Q. Waste & Housekeeping</button>
    </div>

    <!-- Checklist Sections -->
    <div id="section-A" class="section-checklist">
        <h2>A. System Designs</h2>
        <div class="checkbox-item">
            <input type="checkbox" id="A1" name="A1">
            <label for="A1">1 - As-built system documents e.g. Installation Layouts and Single Line drawings</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="A2" name="A2">
            <label for="A2">2 - As-built system documents are available at the site</label>
        </div>
        <div>
            <label for="team-member-A">Team Member:</label>
            <select id="team-member-A" name="team-member-A">
                <option value="">-- Select Team Member --</option>
                <!-- Dynamic team members will be inserted here -->
            </select>
        </div>
        <div>
            <label for="crosschecked-by-A">Crosschecked by:</label>
            <select id="crosschecked-by-A" name="crosschecked-by-A">
                <option value="">-- Select Team Member --</option>
                <!-- Dynamic team members will be inserted here -->
            </select>
        </div>
    </div>

    <div id="section-B" class="section-checklist">
        <h2>B. PV Modules</h2>
        <div class="checkbox-item">
            <input type="checkbox" id="B1" name="B1">
            <label for="B1">1 - All arrays are square, consistent, and neat to the eye</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="B2" name="B2">
            <label for="B2">2 - Modules are securely and neatly installed</label>
        </div>
        <div>
            <label for="team-member-B">Team Member:</label>
            <select id="team-member-B" name="team-member-B">
                <option value="">-- Select Team Member --</option>
                <!-- Dynamic team members will be inserted here -->
            </select>
        </div>
        <div>
            <label for="crosschecked-by-B">Crosschecked by:</label>
            <select id="crosschecked-by-B" name="crosschecked-by-B">
                <option value="">-- Select Team Member --</option>
                <!-- Dynamic team members will be inserted here -->
            </select>
        </div>
    </div>

    <!-- More sections (C, D, E, etc.) would follow a similar structure -->

</div>

<!-- Script to toggle sections based on button clicks -->
<script>
    // Get all buttons
    const buttons = document.querySelectorAll('.section-button');

    buttons.forEach(button => {
        button.addEventListener('click', function() {
            const section = this.getAttribute('data-section');
            const sectionElement = document.getElementById('section-' + section);

            // Toggle 'selected' class on button
            this.classList.toggle('selected');

            // Toggle the visibility of the section
            sectionElement.classList.toggle('active');
        });
    });
</script>

</body>
</html>
