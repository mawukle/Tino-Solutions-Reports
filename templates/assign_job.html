<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TINO SOLUTIONS DAILY REPORT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <!-- Upgrade to the latest version of html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="container" id="report-container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        <!-- Back to Homepage Link -->
        <a href="{{ url_for('assign_job') }}" class="back-link">The Renewable Energy Experts</a>

        <h1>DAILY REPORT</h1>
        <form action="{{ url_for('assign_job') }}" method="post" enctype="multipart/form-data" id="daily-report-form">
            <!-- Date and Percentage Completion -->
            <div id="dates_filter">
                <label for="job_date">Job Date:</label>
                <input type="text" id="job_date_display" name="job_date_display" placeholder="Select a date" required readonly value="{{ selected_date }}"><br>
                <input type="hidden" id="job_date" name="job_date" value="{{ selected_date }}">

                <label for="percentage_completion">% Completion:</label>
                <input type="number" id="percentage_completion" name="percentage_completion" min="0" max="100" step="5" required>
            </div>

            <!-- Client Information -->
            <div id="location_filter">
                <label for="client_name">Client Name:</label>
                <input type="text" id="client_name" name="client_name" required class="client-select"><br>
            </div>
            <div id="location_filter">
                <label for="client_location">Location:</label>
                <input type="text" id="client_location" name="client_location" readonly><br>
            </div>

            <!-- Tasks Performed and Any Issues -->
            <label for="tasks_performed">Tasks Performed:</label>
            <textarea id="input_entries" name="tasks_performed" rows="4" cols="50" required></textarea>

            <label for="any_issues">Any Issues:</label>
            <textarea id="input_entries" name="any_issues" rows="4" cols="50" required></textarea>

            <!-- Select Team Members (Click to select) -->
            <label for="team_members">Select Team Members:</label>
            <div id="team_members">
                {% for member in team_members %}
                    <!-- Hidden checkbox that will hold the team member's value when selected -->
                    <input type="checkbox" name="team_members" id="team_member_{{ member[0] }}" value="{{ member[0] }}" style="display:none;">

                    <!-- Clickable team member -->
                    <span class="team-member" data-member-id="{{ member[0] }}">{{ member[1] }}</span>
                {% endfor %}
            </div>

            <h1>Project Checklist</h1>

            <!-- Section Selection with Buttons -->
            <div class="section-select">
                <h3>Select Sections:</h3>
                <button class="section-button" data-section="A">A. System Designs</button>
                <button class="section-button" data-section="B">B. PV Modules</button>
            </div>

            <!-- Checklist Section A -->
            <div id="section-A" class="section-checklist">
                <h2>A. System Designs</h2>
                <div class="checkbox-item">
                    <div class="dual-checkbox" id="A1"></div>
                    <label for="A1">1 - As-built system documents e.g. Installation Layouts and Single Line drawings</label>
                </div>
                <div class="checkbox-item">
                    <div class="dual-checkbox" id="A2"></div>
                    <label for="A2">2 - As-built system documents are available at the site</label>
                </div>
                <div id="team-member-wrapper">
                    <label for="team-member-A">Installer:</label>
                    <select id="team-member-A" name="team-member-A">
                        <option value="">-- Installation Engineer --</option>
                        {% for member in team_members %}
                        <option value="{{ member.Team_Member_ID }}">{{ member.Team_Member_Name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div id="crosschecked-by-wrapper">
                    <label for="crosschecked-by-A">Cross-checked by:</label>
                    <select id="crosschecked-by-A" name="crosschecked-by-A">
                        <option value="">-- Quality Control Engineer --</option>
                        {% for member in team_members %}
                        <option value="{{ member.Team_Member_ID }}">{{ member.Team_Member_Name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Checklist Section B -->
            <div id="section-B" class="section-checklist">
                <h2>B. PV Modules</h2>
                <div class="checkbox-item">
                    <div class="dual-checkbox" id="B1"></div>
                    <label for="B1">1 - All arrays are square, consistent, and neat to the eye</label>
                </div>
                <div class="checkbox-item">
                    <div class="dual-checkbox" id="B2"></div>
                    <label for="B2">2 - Modules are securely and neatly installed</label>
                </div>
                <div id="team-member-wrapper">
                    <label for="team-member-B">Installer:</label>
                    <select id="team-member-B" name="team-member-B">
                        <option value="">-- Installation Engineer --</option>
                        {% for member in team_members %}
                        <option value="{{ member.Team_Member_ID }}">{{ member.Team_Member_Name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div id="crosschecked-by-wrapper">
                    <label for="crosschecked-by-B">Cross-checked by:</label>
                    <select id="crosschecked-by-B" name="crosschecked-by-B">
                        <option value="">-- Quality Control Engineer --</option>
                        {% for member in team_members %}
                        <option value="{{ member.Team_Member_ID }}">{{ member.Team_Member_Name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>


            <!-- Submit Button -->
            <button type="submit" id="submit-button">Submit</button>
        </form>

        <script>
            $(document).ready(function() {
                // Datepicker with custom formatting
                $('#job_date_display').datepicker({
                    dateFormat: 'yy-mm-dd',
                    onSelect: function(dateText) {
                        const selectedDate = new Date(dateText);
                        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                        const formattedDate = selectedDate.toLocaleDateString('en-GB', options);

                        // Add day suffix (st, nd, rd, th)
                        const day = selectedDate.getDate();
                        const suffix = (day == 1 || day == 21 || day == 31) ? 'st' :
                                    (day == 2 || day == 22) ? 'nd' :
                                    (day == 3 || day == 23) ? 'rd' : 'th';
                        const dayWithSuffix = `${day}${suffix}`;

                        // Update display and hidden input
                        const formattedDateWithSuffix = formattedDate.replace(/\d+/, dayWithSuffix);
                        $('#job_date_display').val(formattedDateWithSuffix);
                        $('#job_date').val(dateText);  // Store the date for submission
                    }
                });

                // Autocomplete for client names
                $("#client_name").autocomplete({
                    source: function(request, response) {
                        $.ajax({
                            url: "{{ url_for('autocomplete_client') }}",
                            type: "GET",
                            data: { term: request.term },
                            success: function(data) {
                                response(data);
                            }
                        });
                    },
                    minLength: 2,
                    select: function(event, ui) {
                        $.ajax({
                            url: "{{ url_for('get_client_details') }}",
                            type: "GET",
                            data: { client_name: ui.item.value },
                            success: function(data) {
                                if (data) {
                                    $("#client_location").val(data.town);  // Set the Location field
                                }
                            }
                        });
                    }
                });

                // Event delegation for team member toggle
                $('#team_members').on('click', '.team-member', function() {
                    var memberId = $(this).data('member-id');
                    var checkbox = $('#team_member_' + memberId);

                    checkbox.prop('checked', !checkbox.prop('checked')); // Toggle checkbox state

                    $(this).toggleClass('selected'); // Toggle the 'selected' class
                });

                // Capture the form and download as an image on submit
                $('#submit-button').click(function(event) {
                    event.preventDefault(); // Prevent form submission

                    // Capture the form content as an image
                    html2canvas(document.querySelector("#report-container")).then(function(canvas) {
                        // Create a link element and set the captured image as download
                        var link = document.createElement('a');
                        link.href = canvas.toDataURL('image/png'); // Change format if needed
                        link.download = 'daily_report.png';
                        link.click();
                    });

                    // Submit the form after capturing the image
                    setTimeout(function() {
                        $('#daily-report-form').submit();
                    }, 1000);  // Slight delay to ensure image capture happens first
                });

                // Dual Checkbox functionality
                document.querySelectorAll('.dual-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('click', function () {
                        if (this.classList.contains('checked')) {
                            this.classList.remove('checked');
                            this.classList.add('crossed');
                        } else if (this.classList.contains('crossed')) {
                            this.classList.remove('crossed');
                        } else {
                            this.classList.add('checked');
                        }
                    });
                });

                // Toggle checklist sections
                const buttons = document.querySelectorAll('.section-button');
                buttons.forEach(button => {
                    button.addEventListener('click', function() {
                        const section = this.getAttribute('data-section');
                        const sectionElement = document.getElementById('section-' + section);
                        this.classList.toggle('selected');
                        sectionElement.classList.toggle('active');
                    });
                });
            });
        </script>

    </div>
</body>
</html>
